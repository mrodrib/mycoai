<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MycoAI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }
    body { background: #F4F6F3; color: #19221D; display: flex; justify-content: center; min-height: 100vh; }
    #app { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; padding: 20px 16px; display: flex; flex-direction: column; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    h1 { font-size: 1.4rem; color: #1C3829; }
    .badge { background: #E8F2EC; color: #1C3829; font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
    .alert-danger { background: #FDF2F2; border: 1px solid #F6C6C6; color: #8A1C14; padding: 12px; border-radius: 12px; font-size: 0.82rem; line-height: 1.4; margin-bottom: 16px; }
    .hero { background: linear-gradient(145deg, #1C3829, #284F3B); color: #fff; padding: 24px 16px; border-radius: 18px; text-align: center; margin-bottom: 20px; }
    .hero h2 { font-size: 1.3rem; margin-bottom: 6px; }
    .hero p { font-size: 0.8rem; color: #D1E0D7; margin-bottom: 18px; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-action { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 14px 10px; border-radius: 12px; font-weight: 700; font-size: 0.9rem; text-align: center; cursor: pointer; display: block; }
    .preview-box { width: 100%; height: 250px; background: #000; border-radius: 14px; overflow: hidden; margin-bottom: 16px; display: none; }
    .preview-box img { width: 100%; height: 100%; object-fit: contain; }
    .status-box { padding: 16px; border-radius: 12px; text-align: center; font-weight: 600; font-size: 0.9rem; margin-bottom: 16px; display: none; }
    .status-loading { background: #E8F2EC; color: #1C3829; }
    .card { border: 1px solid #E3E8E1; border-radius: 14px; padding: 14px; margin-bottom: 12px; background: #fff; }
    .card h3 { font-size: 1.15rem; color: #1C3829; }
    .card em { font-size: 0.85rem; color: #627367; display: block; margin-bottom: 8px; }
    .tag-tox { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; margin-bottom: 8px; }
    .tag-deadly { background: #FCE8E6; color: #B3261E; }
    .tag-warn { background: #FFF3E0; color: #B56507; }
    .detail { background: #F8F9F6; font-size: 0.8rem; padding: 8px 10px; border-radius: 8px; margin-top: 6px; line-height: 1.35; }
    .btn-reset { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #E3E8E1; color: #19221D; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-top: 10px; display: none; }
  </style>
</head>
<body>

<div id="app">
  <header>
    <h1>MycoAI</h1>
    <span class="badge">IA Real v2.0</span>
  </header>

  <div class="alert-danger">
    <strong>⚠️ BIOSEGURIDAD:</strong> Nunca consumas setas basándote en esta identificación. Muchas especies mortales tienen dobles idénticos.
  </div>

  <!-- ZONA DE BOTONES PRINCIPALES -->
  <div id="home-panel">
    <div class="hero">
      <h2>Identificador de Setas</h2>
      <p>Sube o fotografía una muestra micológica</p>

      <div class="btn-row">
        <!-- Usamos un truco directo de click para que iPhone nunca falle -->
        <button class="btn-action" onclick="document.getElementById('input-camera').click()">📷 Fotografiar</button>
        <button class="btn-action" onclick="document.getElementById('input-gallery').click()">🖼️ Galería</button>
      </div>
    </div>
  </div>

  <!-- PREVISUALIZACIÓN -->
  <div id="preview-box" class="preview-box">
    <img id="preview-img" src="" alt="Seta capturada">
  </div>

  <!-- ESTADO DE PROCESAMIENTO -->
  <div id="status-loading" class="status-box status-loading">
    ⏳ Analizando morfología con Google Gemini...
  </div>

  <!-- RESULTADOS -->
  <div id="results-container"></div>

  <!-- BOTÓN VOLVER -->
  <button id="btn-reset" class="btn-reset" onclick="resetApp()">← Fotografiar otra seta</button>

  <!-- INPUTS NATIVOS OCULTOS -->
  <input type="file" id="input-camera" accept="image/*" capture="environment" style="display:none;" onchange="handleFileSelected(this)">
  <input type="file" id="input-gallery" accept="image/*" style="display:none;" onchange="handleFileSelected(this)">
</div>

<script>
function resetApp() {
  document.getElementById('home-panel').style.display = 'block';
  document.getElementById('preview-box').style.display = 'none';
  document.getElementById('status-loading').style.display = 'none';
  document.getElementById('results-container').innerHTML = '';
  document.getElementById('btn-reset').style.display = 'none';
  document.getElementById('input-camera').value = '';
  document.getElementById('input-gallery').value = '';
}

async function handleFileSelected(inputElement) {
  const file = inputElement.files[0];
  if (!file) return;

  // 1. Ocultar inicio y mostrar imagen elegida
  document.getElementById('home-panel').style.display = 'none';
  document.getElementById('preview-box').style.display = 'block';
  document.getElementById('status-loading').style.display = 'block';
  document.getElementById('results-container').innerHTML = '';
  document.getElementById('btn-reset').style.display = 'none';

  const previewImg = document.getElementById('preview-img');
  previewImg.src = URL.createObjectURL(file);

  try {
    // 2. Convertir imagen a base64
    const base64Image = await fileToBase64(file);

    // 3. Enviar al backend en Render
    const response = await fetch('/api/identify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ imageBase64: base64Image })
    });

    document.getElementById('status-loading').style.display = 'none';
    document.getElementById('btn-reset').style.display = 'block';

    if (!response.ok) {
      const errorJson = await response.json().catch(() => ({}));
      showError(errorJson.details || errorJson.error || `Error HTTP ${response.status}`);
      return;
    }

    const data = await response.json();
    renderCards(data);

  } catch (err) {
    document.getElementById('status-loading').style.display = 'none';
    document.getElementById('btn-reset').style.display = 'block';
    showError("Fallo de conexión: " + err.message);
  }
}

// Lectura de archivo rápida y compatible con iPhone
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const max = 800;
        let w = img.width, h = img.height;
        if (w > max || h > max) {
          if (w > h) { h = Math.round((h * max) / w); w = max; }
          else { w = Math.round((w * max) / h); h = max; }
        }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function showError(msg) {
  document.getElementById('results-container').innerHTML = `
    <div class="alert-danger" style="margin-top:10px;">
      <strong>⚠️ Ocurrió un problema:</strong><br>${msg}
    </div>`;
}

function renderCards(data) {
  const container = document.getElementById('results-container');

  if (!data.isClearImage) {
    container.innerHTML += `
      <div style="background:#FFF8E6; border:1px solid #E5C266; color:#7A5500; padding:12px; border-radius:12px; font-size:0.8rem; margin-bottom:12px;">
        ⚠️ <strong>Foto poco concluyente:</strong> Procura fotografiar la seta de cerca mostrando sombrero y pie completo.
      </div>`;
  }

  if (data.candidates && data.candidates.length > 0) {
    data.candidates.forEach(c => {
      container.innerHTML += `
        <div class="card">
          <h3>${c.commonName || 'Especie sin nombre común'}</h3>
          <em>${c.scientificName} (${Math.round((c.probability || 0.8) * 100)}% coincidencia)</em>

          <div class="tag-tox ${c.isDeadly ? 'tag-deadly' : 'tag-warn'}">
            ${c.isDeadly ? '☠️ ESPECIE MORTAL' : '⚠️ Toxicidad: ' + c.toxicityLevel}
          </div>

          <div class="detail"><strong>Rasgos visuales:</strong> ${c.visualEvidences || 'Sin descripción'}</div>
          <div class="detail" style="color:#8A1C14;"><strong>Peligro de confusión:</strong> ${c.dangerousLookalikes || 'No documentado'}</div>
          <div class="detail"><strong>Hábitat habitual:</strong> ${c.habitat || 'Bosques y praderas'}</div>
        </div>`;
    });
  } else {
    container.innerHTML = '<p style="text-align:center; color:#627367; padding:10px;">No se reconoció ninguna seta en la fotografía.</p>';
  }
}
</script>
</body>
</html>
